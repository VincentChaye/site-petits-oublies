<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 56" width="320" height="56" role="img" aria-hidden="true" focusable="false">
  <title>Les Petits Oubliés</title>
  <g fill="#5C3D23">
    <!-- Deux empreintes de pattes, reprises du flyer -->
    <g transform="translate(4 20) scale(0.55)">
      <ellipse cx="10" cy="20" rx="8.5" ry="10"/>
      <ellipse cx="2" cy="5" rx="4" ry="5.2"/>
      <ellipse cx="11" cy="1" rx="4" ry="5.6"/>
      <ellipse cx="20" cy="6" rx="4" ry="5.2"/>
    </g>
    <g transform="translate(24 6) scale(0.75)">
      <ellipse cx="10" cy="20" rx="8.5" ry="10"/>
      <ellipse cx="2" cy="5" rx="4" ry="5.2"/>
      <ellipse cx="11" cy="1" rx="4" ry="5.6"/>
      <ellipse cx="20" cy="6" rx="4" ry="5.2"/>
    </g>
  </g>
  <text x="62" y="30" font-family="Georgia, 'Times New Roman', serif" font-size="25" font-weight="700" fill="#4A2F1A">Les Petits Oubliés</text>
  <text x="63" y="47" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="11.5" letter-spacing="0.6" fill="#3F6B2E">Aider les animaux abandonnés, errants ou maltraités</text>
</svg>
